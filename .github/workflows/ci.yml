name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/menuchi
  REDIS_URL: redis://localhost:6379/0
  TRANSFORMERS_REDIS_URL: redis://localhost:6379/1
  OTP_REDIS_URL: redis://localhost:6379/2
  OTP_STREAM: otps
  INTERNAL_OTP_URL: http://localhost:9000
  INTERNAL_OTP_ENDPOINT: /api/v1/get-otp
  TRANSFORMERS_STREAM: images
  MENUCHI_FRONT_URL: "http://localhost:3000"
  # Dummy test values: S3 is mocked in test/vitest.setup.ts and these
  # only need to satisfy zod length checks. Real secrets are NOT required
  # for unit/integration tests (keeps forks + PRs green without setup).
  S3_BUCKETNAME: test-bucket
  S3_ENDPOINT: https://s3.amazonaws.com
  S3_ACCESSKEYID: test-access-key
  S3_SECRETACCESSKEY: test-secret-key
  S3_DEFAULT_KEY: test-bucket/default.jpg
  SESSION_SECRET: test-session-secret-32plus-characters-long
  COOKIE_PRIVATE_KEY: test-cookie-key-16plus
  JWT_PRIVATE_KEY: test-jwt-key-16plus

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menuchi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./src/db/schema.prisma

      - name: Generate TSOA routes
        run: npx tsoa spec-and-routes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Push DB with prisma
        run: npm run db-push

      - name: Test with coverage
        run: npm run test:coverage

  build-push:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.ref == 'refs/heads/main' && 'mahdihaghverdi/menuchi-project:stable' || 'mahdihaghverdi/menuchi-project:dev' }}
          target: runtime
