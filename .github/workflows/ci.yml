name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/menuchi
  REDIS_URL: redis://redis:6379/0
  TRANSFORMERS_REDIS_URL: redis://redis:6379/1
  OTP_REDIS_URL: redis://redis:6379/2
  OTP_STREAM: otps
  INTERNAL_OTP_URL: http://localhost:9000
  INTERNAL_OTP_ENDPOINT: /api/v1/get-otp
  TRANSFORMERS_STREAM: images
  MENUCHI_FRONT_URL: "http://localhost:3000"
  S3_BUCKETNAME: ${{ secrets.S3_BUCKETNAME }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  S3_ACCESSKEYID: ${{ secrets.S3_ACCESSKEYID }}
  S3_SECRETACCESSKEY: ${{ secrets.S3_SECRETACCESSKEY }}
  S3_DEFAULT_KEY: ${{ secrets.S3_DEFAULT_KEY }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  COOKIE_PRIVATE_KEY: ${{ secrets.COOKIE_PRIVATE_KEY }}
  JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menuchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Deps
        run: npm ci

      - name: Lint
        run: npm run lint && npm run typecheck && npm run format:check

      - name: Push DB with prisma
        run: npm run db-push

      - name: Test with coverage
        run: npm run test:coverage

  build-push:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name == 'push'

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ github.ref == 'refs/heads/main' && 'mahdihaghverdi/menuchi-project:stable' || 'mahdihaghverdi/menuchi-project:dev' }}
          target: runtime
