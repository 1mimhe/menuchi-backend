networks:
  menuchi.net.back:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
      com.docker.network.bridge.name: "menuchi_bnet"
    ipam:
      driver: default
      config:
        - subnet: 172.16.10.0/24

volumes:
  menuchi_data:
    name: menuchi_data

  menuchi_redis_data:
    name: menuchi_redis_data

services:
  menuchi.api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: menuchi.api:dev
    hostname: menuchi.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@menuchi.psql:5432/menuchi
      REDIS_URL: redis://menuchi.redis:6379/0
      TRANSFORMERS_REDIS_URL: redis://menuchi.redis:6379/1
      OTP_REDIS_URL: redis://menuchi.redis:6379/2
    depends_on:
      menuchi.psql:
        condition: service_healthy
      menuchi.redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      menuchi.net.back:

  menuchi.psql:
    image: postgres:16-bookworm
    hostname: menuchi.psql
    container_name: menuchi.psql
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      TZ: "Asia/Tehran"
      PGTZ: "Asia/Tehran"
      POSTGRES_DB: menuchi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menuchi"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 10s
    env_file:
      - .env
    volumes:
      - "menuchi_data:/var/lib/postgresql/data"
    networks:
      menuchi.net.back:

  menuchi.redis:
    image: redis:7-alpine
    hostname: menuchi.redis
    container_name: menuchi.redis
    restart: always
    stop_grace_period: 20s
    environment:
      TZ: "Asia/Tehran"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s
    volumes:
      - "menuchi_redis_data:/data:rw"
    ports:
      - "6379:6379"
    networks:
      menuchi.net.back:
